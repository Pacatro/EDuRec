[project]
name = "edurec"
version = "0.1.0"
description = "The objective of this Master's Thesis is to develop a recommendation system for e-learning based on a benchmark dataset, which will allow evaluating its performance in comparison with previous models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas<3.0.0",
  "scikit-learn>=1.6.1",
  "torch>=2.8.0",
  "matplotlib>=3.10.1",
  "torchmetrics>=1.8.0",
  "lightning[extra]>=2.5.2",
  "openpyxl>=3.1.5",
  "scipy>=1.15.2",
  "scikit-posthocs>=0.11.4",
  "pydantic>=2.11.9",
  "typer>=0.19.2",
  "recbole>=1.2.0",
  "pandas-stubs>=2.3.3.260113",
  "ray[tune]>=2.53.0",
  "numpy<2.0.0",
  "kmeans-pytorch>=0.3",
  "wandb>=0.24.1",
]

[dependency-groups]
dev = ["wandb>=0.24.0", "pytest>=9.0.2"]


[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[project.scripts]
edurec = "edurec.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
