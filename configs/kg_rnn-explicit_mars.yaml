arch: kg_rnn
model:
  num_users: 4741
  num_items: 1609
  num_item_dense_feats: 386
  num_item_text_feats: 384
  num_user_dense_feats: 0
  num_interaction_dense_feats: 2
  user_cat_cardinalities:
  - 25
  interaction_cat_cardinalities: []
  has_history: true
  kg_node_counts:
    attr::language: 2
    attr::difficulty: 3
    attr::item_type: 3
    attr::job: 16
    attr::software: 51
    attr::theme: 33
  kg_edge_types:
  - - item
    - language
    - attr::language
  - - item
    - difficulty
    - attr::difficulty
  - - item
    - item_type
    - attr::item_type
  - - item
    - job
    - attr::job
  - - item
    - software
    - attr::software
  - - item
    - theme
    - attr::theme
  - - attr::language
    - rev_language
    - item
  - - attr::difficulty
    - rev_difficulty
    - item
  - - attr::item_type
    - rev_item_type
    - item
  - - attr::job
    - rev_job
    - item
  - - attr::software
    - rev_software
    - item
  - - attr::theme
    - rev_theme
    - item
  emb_dim: 128
  use_item_bias: true
  dropout: 0.1
  graph_mode: kg
  use_text_features: true
  use_item_features: true
  use_user_features: true
  use_interaction_features: true
  use_time_features: true
