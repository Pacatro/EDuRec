  gcl_temperature: 0.2
  gcl_edge_dropout: 0.1
  gcl_max_items: 512
  rnn_type: gru
  rnn_hidden_dim: 128
  rnn_layers: 1
  rnn_dropout: 0.1
  transformer_hidden_dim: 128
  transformer_layers: 2
  transformer_heads: 4
  max_history_len: 50
  scorer_max_pairs_per_chunk: 32768
  hidden_dims:
  - 256
train:
  epochs: 150
  lr: 0.0003
  batch_size: 256
  patience: 5
  weight_decay: 1.0e-05
  topks:
  - 5
  - 10
  - 20
  adaptive_k: false
  max_history: 50
  deduplicate_interactions: false
